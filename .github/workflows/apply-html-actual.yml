name: Apply actual HTML fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-html-actual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct HTML changes
        run: python3 .github/apply_html_actual.py

      - name: Remove temporary transport files
        run: |
          rm -f .github/apply_html_actual.py
          rm -f .github/workflows/apply-html-actual.yml

      - name: Commit actual HTML files
        run: |
          git config user.name "TDSA Site Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair footer grids and about hero in actual HTML files"
          git push origin main
