name: Verify TeleDoctorSA website

on:
  push:
    paths:
      - '*.html'
      - 'scripts/**'
      - 'styles/**'
      - 'images/qr/**'
      - '.github/workflows/install-visible-rebuild-images.yml'
  pull_request:
    paths:
      - '*.html'
      - 'scripts/**'
      - 'styles/**'
      - 'images/qr/**'
      - '.github/workflows/install-visible-rebuild-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check website links and JavaScript
        run: node scripts/verify-site.mjs
      - name: Install browser verification dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Browser-test website navigation and homepage
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tdsa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node scripts/verify-design.mjs
          node scripts/verify-navbar.mjs
          node scripts/verify-home-hero.mjs
          node scripts/verify-updates.mjs
      - name: Save website design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-design-screenshots
          path: website-screenshots/
          retention-days: 7
          if-no-files-found: ignore
