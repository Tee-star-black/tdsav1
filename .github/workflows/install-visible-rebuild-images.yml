name: Install shared TeleDoctorSA experience

on:
  push:
    paths:
      - 'scripts/rebuild-images.js'
      - 'scripts/mobile-nav.js'
      - '.github/workflows/install-visible-rebuild-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject shared experience script into all root HTML pages
        shell: python
        run: |
          from pathlib import Path

          pages = sorted(Path('.').glob('*.html'))
          tag = '<script src="scripts/rebuild-images.js"></script>'

          for path in pages:
              text = path.read_text(encoding='utf-8-sig')
              if tag in text:
                  continue

              if '<script src="scripts/support-chatbot.js"></script>' in text:
                  text = text.replace(
                      '<script src="scripts/support-chatbot.js"></script>',
                      '<script src="scripts/support-chatbot.js"></script>\n    ' + tag,
                      1
                  )
              elif '</body>' in text:
                  text = text.replace('</body>', '    ' + tag + '\n</body>', 1)
              else:
                  print('skipped (no body):', path.name)
                  continue

              path.write_text(text, encoding='utf-8')
              print('updated', path.name)

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: install shared TDSA experience across all pages"
          git push
