name: Install visible rebuild images

on:
  push:
    paths:
      - 'scripts/rebuild-images.js'
      - 'scripts/update-app-live.py'
      - '.github/workflows/install-visible-rebuild-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject shared routing script into public pages
        shell: python
        run: |
          from pathlib import Path

          pages = [
              'index.html',
              'about-us.html',
              'our-services.html',
              'contact-us.html',
              'telemedia-suite.html',
              'teledoctorsa-app.html',
              'app.html',
              'ehr.html',
              'ecg247.html',
              'virtual-consultations.html',
              'shop.html',
              'doctors.html',
              'nurses.html',
              'patients.html',
              'patients-portal.html',
              'privacy-policy.html',
              'legal-notice.html',
              'returns-policy.html',
          ]

          tag = '<script src="scripts/rebuild-images.js"></script>'

          for name in pages:
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8-sig')
              if tag in text:
                  continue
              if '<script src="scripts/support-chatbot.js"></script>' in text:
                  text = text.replace(
                      '<script src="scripts/support-chatbot.js"></script>',
                      '<script src="scripts/support-chatbot.js"></script>\n    ' + tag
                  )
              elif '</body>' in text:
                  text = text.replace('</body>', '    ' + tag + '\n</body>', 1)
              else:
                  continue
              path.write_text(text, encoding='utf-8')
              print('updated', name)

      - name: Publish live TeleDoctorSA app CTA
        run: python scripts/update-app-live.py

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix: enable shared navigation and routing across public pages"
          git push
