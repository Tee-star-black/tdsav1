name: Publish TeleDoctorSA production HTML

on:
  push:
    paths:
      - 'site-polish.css'
      - 'styles/**'
      - 'scripts/**'
      - '.github/workflows/install-visible-rebuild-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean actual HTML and refresh asset versions
        shell: python
        run: |
          from pathlib import Path
          import re

          version = '20260909-1846'
          marker_blocks = [
              ('TDS_MOBILE_NAV_START', 'TDS_MOBILE_NAV_END'),
              ('TDS_MOBILE_NAV_HTML_START', 'TDS_MOBILE_NAV_HTML_END'),
              ('TDS_MOBILE_NAV_SCRIPT_START', 'TDS_MOBILE_NAV_SCRIPT_END'),
          ]
          shared_scripts = [
              'scripts/navigation.js',
              'scripts/rebuild-images.js',
              'scripts/homepage.js',
              'scripts/homepage-slider.js',
              'scripts/site-ux-v4.js',
          ]

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8-sig')
              original = text

              for start, end in marker_blocks:
                  text = re.sub(
                      rf'\s*<!--\s*{start}\s*-->.*?<!--\s*{end}\s*-->\s*',
                      '\n',
                      text,
                      flags=re.S,
                  )

              text = re.sub(
                  r'\s*<script[^>]+src=["\'][^"\']*mobile-navigation\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*',
                  '\n',
                  text,
                  flags=re.I,
              )

              text = re.sub(r'\?v=20260909(?:-[0-9]+)?', f'?v={version}', text)

              for script in shared_scripts:
                  pattern = rf'(?P<prefix><script[^>]+src=["\']/?){re.escape(script)}(?:\?v=[^"\']*)?(?P<suffix>["\'][^>]*></script>)'
                  text = re.sub(pattern, rf'\g<prefix>{script}?v={version}\g<suffix>', text, flags=re.I)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print('updated', path)

      - name: Publish live TeleDoctorSA app CTA
        run: python scripts/update-app-live.py

      - name: Validate production HTML
        shell: python
        run: |
          from pathlib import Path

          bad = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'tds-mobile-nav' in text or 'mobile-navigation.js' in text or 'TDS_MOBILE_NAV_' in text:
                  bad.append(str(path))
          if bad:
              raise SystemExit('Legacy mobile dock still present in: ' + ', '.join(bad))

          index = Path('index.html').read_text(encoding='utf-8')
          assert 'styles/ux-v4.css?v=20260909-1846' in index
          assert 'site-polish.css?v=20260909-1846' in index
          print('Production HTML validation passed')

      - name: Commit actual HTML changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*/index.html'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix: remove legacy mobile dock and refresh production assets"
          git push
