name: Apply direct HTML production layout

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update real HTML files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          start = '<!-- TDS_DIRECT_PRODUCTION_LAYOUT_START -->'
          end = '<!-- TDS_DIRECT_PRODUCTION_LAYOUT_END -->'

          css = '''<!-- TDS_DIRECT_PRODUCTION_LAYOUT_START -->
<style id="tds-production-layout">
:root {
  --tds-shell: 1200px;
  --tds-gutter: clamp(16px, 3vw, 32px);
  --tds-section-y: clamp(34px, 4vw, 52px);
  --tds-grid-gap: clamp(14px, 1.8vw, 22px);
}
html, body {
  width: 100% !important;
  max-width: 100% !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow-x: clip !important;
}
*, *::before, *::after { box-sizing: border-box !important; }
img, video, iframe, svg { max-width: 100%; }
img, video { height: auto; }
body > main, body > header, body > footer, body > section, main > section {
  width: 100% !important;
  max-width: 100% !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
}
nav:not(.tds-mobile-nav) {
  position: sticky !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  max-width: 100% !important;
  min-height: 60px !important;
  height: auto !important;
  margin: 0 !important;
  padding: 8px clamp(16px, 4vw, 56px) !important;
  gap: clamp(12px, 1.6vw, 22px) !important;
  z-index: 1200 !important;
}
nav:not(.tds-mobile-nav).scrolled { padding-top: 7px !important; padding-bottom: 7px !important; }
nav:not(.tds-mobile-nav) .logo { gap: 9px !important; }
nav:not(.tds-mobile-nav) .logo img {
  height: 38px !important;
  width: auto !important;
  max-width: 46px !important;
  max-height: 38px !important;
  object-fit: contain !important;
}
nav:not(.tds-mobile-nav) .logo-text { font-size: clamp(1.05rem, 1.5vw, 1.42rem) !important; }
nav:not(.tds-mobile-nav) .nav-links { gap: clamp(12px, 1.5vw, 22px) !important; }
nav:not(.tds-mobile-nav) .nav-links a,
nav:not(.tds-mobile-nav) .btn-main { font-size: .86rem !important; }
nav:not(.tds-mobile-nav) .btn-main { min-height: 38px !important; padding: 8px 15px !important; }
section:not(.core-highlights-slider):not(.hero) {
  min-height: 0 !important;
  height: auto !important;
  padding-top: var(--tds-section-y) !important;
  padding-bottom: var(--tds-section-y) !important;
}
.container, .content-container, .page-container, .section-container, .section-inner,
.services-header, .services-grid, .info-grid, .trust-assurance-grid,
.telemedicine-explainer-grid, .location-grid, .tech-showcase-content,
.objectives-content, .mission-vision-grid, .values-grid, .stats-grid,
.footer-grid, .site-footer-shell, .site-footer-grid {
  width: min(var(--tds-shell), calc(100% - (var(--tds-gutter) * 2))) !important;
  max-width: var(--tds-shell) !important;
  margin-left: auto !important;
  margin-right: auto !important;
}
section > .section-inner { padding-left: 0 !important; padding-right: 0 !important; }
h1 { font-size: clamp(2.15rem, 4vw, 3.9rem) !important; line-height: 1.04 !important; }
h2 { font-size: clamp(1.65rem, 2.6vw, 2.55rem) !important; line-height: 1.09 !important; }
h3 { line-height: 1.2 !important; }
p, li { line-height: 1.55 !important; }
.services-grid, .values-grid, .stats-grid, .info-grid, .trust-assurance-grid,
.telemedicine-explainer-grid, .location-grid, .contact-cards, .product-grid,
.audience-grid, .feature-grid, .features-grid {
  display: grid !important;
  gap: var(--tds-grid-gap) !important;
  align-items: stretch !important;
}
.services-grid, .values-grid, .product-grid, .audience-grid, .feature-grid, .features-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
}
.mission-vision-grid, .info-grid, .trust-assurance-grid, .telemedicine-explainer-grid,
.location-grid, .contact-cards {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: var(--tds-grid-gap) !important;
  align-items: stretch !important;
}
.stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
.services-grid > *, .values-grid > *, .mission-vision-grid > *, .stats-grid > *,
.info-grid > *, .trust-assurance-grid > *, .telemedicine-explainer-grid > *,
.location-grid > *, .contact-cards > *, .product-grid > *, .audience-grid > *,
.feature-grid > *, .features-grid > * {
  min-width: 0 !important;
  height: auto !important;
  min-height: 0 !important;
}
.card, .service-card, .feature-card, .info-focus-card, .trust-proof-card,
.contact-card, .product-card, .audience-card, .stat-card, .shop-role-btn,
.mv-card, .value-card {
  min-height: 0 !important;
  height: auto !important;
}
.card-img, .service-card > img:first-child, .feature-card > img:first-child,
.product-card > img:first-child, .audience-card > img:first-child {
  height: clamp(128px, 11vw, 160px) !important;
  min-height: 0 !important;
  object-fit: cover !important;
}
.card-content, .service-card-content, .feature-card-content,
.product-card-content, .audience-card-content, .mv-card, .value-card, .contact-card,
.info-content, .info-highlight, .telemedicine-explainer-card,
.trust-assurance-panel, .trust-faq-card, .shop-discovery-inner {
  padding: clamp(16px, 1.8vw, 24px) !important;
}
.card h3, .service-card h3, .feature-card h3, .product-card h3,
.audience-card h3, .mv-card h3, .value-card h4 { margin-bottom: 7px !important; }
.card p, .service-card p, .feature-card p, .product-card p,
.audience-card p, .mv-card p, .value-card p { margin-bottom: 9px !important; }
.services-header, .section-header { margin-bottom: 26px !important; }
.icon-wrap, .mv-card-icon, .value-icon { margin-bottom: 10px !important; }
.core-highlights-slider {
  min-height: clamp(500px, 68svh, 690px) !important;
  padding: clamp(50px, 5vw, 74px) clamp(18px, 5vw, 64px) 28px !important;
}
.core-slider-shell { max-width: 1160px !important; gap: 18px !important; }
.core-slide { min-height: 0 !important; height: auto !important; padding: 22px 26px !important; gap: 18px !important; }
.core-slide-visual { min-height: 220px !important; }
.core-slider-actions { margin-top: 16px !important; gap: 9px !important; }
.core-proof-strip { margin-top: 10px !important; }
.hero {
  position: relative !important;
  width: 100% !important;
  height: clamp(560px, 72svh, 720px) !important;
  min-height: 560px !important;
  max-height: none !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow: hidden !important;
}
.hero-slideshow {
  position: relative !important;
  width: 100% !important;
  height: 100% !important;
}
.hero-slide {
  width: 100% !important;
  height: 100% !important;
  min-height: 100% !important;
  padding: clamp(84px, 8vw, 108px) max(var(--tds-gutter), calc((100vw - var(--tds-shell)) / 2 + var(--tds-gutter))) 54px !important;
  align-items: center !important;
}
.hero-content {
  width: min(720px, 100%) !important;
  max-width: 720px !important;
}
.hero h1 { margin-bottom: 16px !important; }
.hero p { margin-bottom: 22px !important; max-width: 620px !important; }
.hero-dots { bottom: 22px !important; }
footer, footer.site-footer, .site-footer {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: clamp(36px, 4vw, 48px) 0 24px !important;
  border-radius: 0 !important;
  overflow: hidden !important;
}
.footer-grid, .site-footer-grid {
  display: grid !important;
  grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
  gap: clamp(20px, 2.2vw, 30px) !important;
  margin-bottom: 24px !important;
  align-items: start !important;
}
.footer-column, .site-footer-brand, .site-footer-column {
  min-width: 0 !important;
  max-width: 100% !important;
}
.footer-column h4, .site-footer-column h4 { margin-bottom: 10px !important; }
.footer-column p, .footer-column a, .site-footer p, .site-footer a, .site-footer span {
  overflow-wrap: anywhere !important;
}
.footer-bottom, .site-footer-bottom {
  width: min(var(--tds-shell), calc(100% - (var(--tds-gutter) * 2))) !important;
  max-width: var(--tds-shell) !important;
  margin: 18px auto 0 !important;
  padding-top: 16px !important;
}
.site-footer-brandline { margin-bottom: 10px !important; }
.site-footer-brandline img { width: 44px !important; height: 44px !important; padding: 5px !important; }
.site-footer-brand p { margin-bottom: 12px !important; }
.site-footer-chip-row { margin-bottom: 12px !important; gap: 7px !important; }
.site-footer-chip { padding: 7px 10px !important; }
.site-footer-actions { gap: 8px !important; }
.btn, .btn-main, .cta-btn, .learn-more-btn, .get-directions-btn,
.site-footer-link, .read-more, [class*="-btn"] { min-height: 38px !important; }
.map-container { height: clamp(260px, 32vw, 380px) !important; }
@media (max-width: 1024px) {
  .services-grid, .values-grid, .product-grid, .audience-grid, .feature-grid, .features-grid,
  .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .footer-grid, .site-footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .site-footer-brand { grid-column: 1 / -1 !important; }
  .hero { height: clamp(540px, 68svh, 650px) !important; min-height: 540px !important; }
}
@media (max-width: 900px) {
  nav:not(.tds-mobile-nav) { padding: 7px 14px !important; min-height: 56px !important; }
  :root { --tds-gutter: 14px; --tds-section-y: 32px; }
  .core-highlights-slider { min-height: auto !important; padding: 50px 14px 22px !important; }
  .core-slide { padding: 18px !important; }
  .hero-slide { padding: 82px 24px 44px !important; }
}
@media (max-width: 767px) {
  body { padding-top: 0 !important; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
  .services-grid, .values-grid, .mission-vision-grid, .stats-grid, .info-grid,
  .trust-assurance-grid, .telemedicine-explainer-grid, .location-grid,
  .contact-cards, .product-grid, .audience-grid, .feature-grid, .features-grid,
  .footer-grid, .site-footer-grid {
    grid-template-columns: 1fr !important;
  }
  .site-footer-brand { grid-column: auto !important; }
  .hero { height: 540px !important; min-height: 540px !important; }
  .hero-slide { padding: 78px 20px 42px !important; }
  .hero h1 { font-size: clamp(2rem, 10vw, 2.75rem) !important; }
  .hero p { font-size: .98rem !important; }
  .card-img { height: 140px !important; }
  footer, .site-footer { padding-top: 32px !important; padding-bottom: 22px !important; }
}
@media (max-width: 480px) {
  :root { --tds-gutter: 10px; --tds-section-y: 28px; }
  .hero { height: 520px !important; min-height: 520px !important; }
  .hero-slide { padding: 72px 16px 40px !important; }
}
</style>
<!-- TDS_DIRECT_PRODUCTION_LAYOUT_END -->'''

          remove_tags = [
              '<script src="scripts/spacious-layout.js"></script>',
              '<script src="scripts/site-wide-optimization.js"></script>',
              '<script src="scripts/final-global-fixes.js"></script>',
          ]

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8-sig')
              original = text

              for tag in remove_tags:
                  text = text.replace(tag, '')

              if start in text and end in text:
                  before = text.split(start, 1)[0]
                  after = text.split(end, 1)[1]
                  text = before + after

              if '</head>' not in text:
                  continue

              text = text.replace('</head>', css + '\n</head>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated', len(changed), 'HTML files')
          for item in changed:
              print(item)
          PY

      - name: Commit HTML changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No HTML updates required"
            exit 0
          fi
          git config user.name "TDSA Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "style: normalize footer grids and about hero directly in HTML"
          git push
