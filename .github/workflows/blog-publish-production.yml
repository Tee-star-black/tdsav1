name: Publish Blog to Production

on:
  repository_dispatch:
    types: [blog_publish]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy generated content to the public site (unchecked = build only)
        required: false
        type: boolean
        default: false

concurrency:
  group: production-blog-publish
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CMS dependencies
        working-directory: blog-cms
        run: npm install --include=dev --no-audit --no-fund

      - name: Validate private CMS API integration configuration
        env:
          CMS_PUBLIC_API_URL: ${{ vars.CMS_PUBLIC_API_URL }}
          CMS_RUN_AUDIENCE: ${{ vars.CMS_RUN_AUDIENCE }}
          CMS_GCP_WIF_PROVIDER: ${{ vars.CMS_GCP_WIF_PROVIDER }}
          CMS_GCP_INVOKER_SA: ${{ vars.CMS_GCP_INVOKER_SA }}
        run: |
          for value in "$CMS_PUBLIC_API_URL" "$CMS_RUN_AUDIENCE" "$CMS_GCP_WIF_PROVIDER" "$CMS_GCP_INVOKER_SA"; do
            if [ -z "$value" ]; then
              echo "::error::Configure CMS_PUBLIC_API_URL, CMS_RUN_AUDIENCE, CMS_GCP_WIF_PROVIDER and CMS_GCP_INVOKER_SA in repository Actions variables."
              exit 1
            fi
          done
          case "$CMS_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "::error::CMS_PUBLIC_API_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Authenticate to private Cloud Run CMS via Workload Identity Federation
        id: cms-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: teledoctor-it
          workload_identity_provider: ${{ vars.CMS_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.CMS_GCP_INVOKER_SA }}
          token_format: id_token
          id_token_audience: ${{ vars.CMS_RUN_AUDIENCE }}
          create_credentials_file: false

      - name: Build Blog & Insights from Cloud SQL content
        working-directory: blog-cms
        env:
          CMS_PUBLIC_API_URL: ${{ vars.CMS_PUBLIC_API_URL }}
          CMS_PUBLIC_API_TOKEN: ${{ steps.cms-auth.outputs.id_token }}
        run: npm run build:blog

      - name: Verify static blog output
        run: |
          test -s blog/index.html
          test -s blog/feed.json
          test -s sitemap.xml
          echo "Static blog build succeeded. Deployment requested: ${{ github.event_name == 'repository_dispatch' || inputs.deploy }}"

      - name: Install FTP client
        if: ${{ github.event_name == 'repository_dispatch' || inputs.deploy }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy generated blog to public_html
        if: ${{ github.event_name == 'repository_dispatch' || inputs.deploy }}
        env:
          FTP_HOST: ${{ secrets.TDSA_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.TDSA_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.TDSA_FTP_PASSWORD }}
          FTP_REMOTE_ROOT: ${{ secrets.TDSA_FTP_REMOTE_ROOT }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_REMOTE_ROOT"
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mkdir -p \"$FTP_REMOTE_ROOT/blog\";
            mkdir -p \"$FTP_REMOTE_ROOT/styles\";
            mkdir -p \"$FTP_REMOTE_ROOT/scripts\";
            mirror -R --delete --verbose blog \"$FTP_REMOTE_ROOT/blog\";
            put -O \"$FTP_REMOTE_ROOT/styles\" styles/blog.css;
            put -O \"$FTP_REMOTE_ROOT/scripts\" scripts/blog.js;
            put -O \"$FTP_REMOTE_ROOT\" sitemap.xml;
          "

      - name: Verify live blog
        if: ${{ github.event_name == 'repository_dispatch' || inputs.deploy }}
        run: |
          curl --fail --retry 5 --retry-delay 5 https://teledoctorsa.co.za/blog/ > /dev/null
          curl --fail --retry 5 --retry-delay 5 https://teledoctorsa.co.za/blog/feed.json > /dev/null
