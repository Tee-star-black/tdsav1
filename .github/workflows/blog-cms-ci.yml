name: Blog CMS CI

on:
  push:
    branches:
      - main
      - feature/blog-cms-studio
      - fix/blog-cms-workflow
    paths:
      - 'blog-cms/**'
      - 'scripts/site-ux-v4.js'
      - '.github/workflows/blog-cms-ci.yml'
  pull_request:
    paths:
      - 'blog-cms/**'
      - 'scripts/site-ux-v4.js'
      - '.github/workflows/blog-cms-ci.yml'

concurrency:
  group: blog-cms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-cms
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure legacy CMS sources and secrets are absent
        working-directory: .
        run: |
          if git grep -in -e Sanity -e SANITY_ -- blog-cms; then
            echo "::error::Legacy CMS dependency remains in active code or documentation."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Run authenticated local smoke test
        run: npm run check
      - name: Run workflow regressions
        run: npm run check:workflow
      - name: Run Cloud Run publisher tests
        run: npm run check:publisher
      - name: Run editor DOM integration tests
        run: npm run check:editor
      - name: Run staff authentication tests
        run: npm run check:auth
      - name: Run Cloud SQL repository tests
        run: npm run check:postgres
      - name: Generate static blog from local backend
        run: npm run build:blog:local
      - name: Verify standalone blog sitemap
        run: |
          test -s ../blog/sitemap.xml
          grep -Fq 'https://teledoctorsa.co.za/blog/' ../blog/sitemap.xml
          test -s ../sitemap.xml
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1 --no-audit --no-fund
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            npx --yes playwright@1.56.1 install --with-deps chromium
          fi
      - name: Verify responsive layouts in real Chromium
        run: node tests/responsive-browser.mjs
      - name: Upload responsive QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-responsive-screenshots
          path: blog-cms/qa-screenshots/
          if-no-files-found: ignore
      - name: Build production CMS/publisher container
        working-directory: .
        run: |
          docker build -f blog-cms/Dockerfile -t tdsa-cms-publisher:ci .
          docker run --rm --entrypoint sh tdsa-cms-publisher:ci -c "command -v lftp && test -s /app/sitemap.xml && node --check /app/blog-cms/scripts/publish-cloud-run-job.mjs"

