name: Blog CMS CI

on:
  push:
    branches:
      - main
      - feature/blog-cms-studio
      - fix/blog-cms-workflow
    paths:
      - 'blog-cms/**'
      - 'scripts/site-ux-v4.js'
      - '.github/workflows/blog-cms-ci.yml'
  pull_request:
    paths:
      - 'blog-cms/**'
      - 'scripts/site-ux-v4.js'
      - '.github/workflows/blog-cms-ci.yml'

concurrency:
  group: blog-cms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-cms
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure legacy CMS sources and secrets are absent
        working-directory: .
        run: |
          if git grep -in -e Sanity -e SANITY_ -- blog-cms .github/workflows/blog-publish-production.yml; then
            echo "::error::Legacy CMS dependency remains in active code or documentation."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Run authenticated local smoke test
        run: npm run check
      - name: Run workflow regressions
        run: npm run check:workflow
      - name: Run editor DOM integration tests
        run: npm run check:editor
      - name: Run staff authentication tests
        run: npm run check:auth
      - name: Run Cloud SQL repository tests
        run: npm run check:postgres
      - name: Generate static blog from local backend
        run: npm run build:blog:local

