name: Refactor TeleDoctorSA homepage

on:
  push:
    paths:
      - '.github/workflows/refactor-homepage.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor homepage structure, styles and scripts
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8-sig')
          original = html

          styles_dir = root / 'styles'
          scripts_dir = root / 'scripts'
          styles_dir.mkdir(exist_ok=True)
          scripts_dir.mkdir(exist_ok=True)

          # 1) Fix the suspicious duplicate closing script tag around the mobile nav block.
          html = re.sub(
              r'(<!-- TDS_MOBILE_NAV_SCRIPT_END -->)\s*</script>\s*(<script>)',
              r'\1\n\2',
              html,
              count=1,
              flags=re.S,
          )

          # 2) Remove the detached logo below the map.
          html, removed_badge = re.subn(
              r'\s*<div class="map-brand-badge"[^>]*>\s*<img[^>]+>\s*</div>',
              '',
              html,
              count=1,
              flags=re.S,
          )

          # 3) Remove the standalone legal strip while preserving the location section close.
          html, removed_legal_strip = re.subn(
              r'\s*<!-- Legal Links Section -->.*?</section>\s*<!-- Footer -->',
              '\n    </section>\n\n    <!-- Footer -->',
              html,
              count=1,
              flags=re.S,
          )

          # 4) Standardise footer column naming and move legal links into one bottom bar.
          html = html.replace('<h3>Care Paths</h3>', '<h3>Quick Links</h3>', 1)
          html = html.replace(
              '<a href="/privacy-policy">Privacy policy</a>',
              '<span>POPIA-aware information handling</span>',
              1,
          )
          html = html.replace(
              '<a href="javascript:void(0)" onclick="openLegal(\'terms-conditions\')">Terms & Conditions</a>',
              '<span>HPCSA-aligned clinical workflows</span>',
              1,
          )
          html = html.replace(
              '<a href="javascript:void(0)" onclick="openLegal(\'legal-notice\')">Legal notice</a>',
              '',
              1,
          )

          footer_bottom = '''<div class="site-footer-bottom">
                <span class="site-footer-copyright">© 2026 TeleDoctorSA · Dr. Mukudu & Partners · Johannesburg, South Africa</span>
                <nav class="site-footer-legal-links" aria-label="Legal and policy links">
                    <a href="/privacy-policy">Privacy</a>
                    <a href="javascript:void(0)" onclick="openLegal('terms-conditions')">Terms</a>
                    <a href="javascript:void(0)" onclick="openLegal('refund-policy')">Refund</a>
                    <a href="javascript:void(0)" onclick="openLegal('legal-notice')">Legal Notice</a>
                    <a href="javascript:void(0)" onclick="openLegal('fulfillment-policy')">Service Fulfilment</a>
                    <a href="javascript:void(0)" onclick="openLegal('governing-law')">Governing Law</a>
                </nav>
            </div>'''
          html, footer_bottom_count = re.subn(
              r'<div class="site-footer-bottom">.*?</div>',
              footer_bottom,
              html,
              count=1,
              flags=re.S,
          )

          # 5) Move large inline CSS blocks into a dedicated legacy CSS file.
          style_pattern = re.compile(r'<style(?P<attrs>[^>]*)>(?P<body>.*?)</style>', re.I | re.S)
          style_blocks = []

          def extract_style(match):
              style_blocks.append(match.group('body').strip())
              return ''

          html = style_pattern.sub(extract_style, html)
          legacy_css = '\n\n'.join(
              f'/* Extracted legacy block {i + 1} */\n{block}'
              for i, block in enumerate(style_blocks)
              if block
          ).strip() + '\n'
          (styles_dir / 'index-legacy.css').write_text(legacy_css, encoding='utf-8')

          # 6) Clean duplicate navigation code from inline scripts before externalising them.
          script_pattern = re.compile(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>', re.I | re.S)
          script_files = []
          used_names = set()
          fallback_counter = 0

          def unique_name(base):
              nonlocal fallback_counter
              if base not in used_names:
                  used_names.add(base)
                  return base
              fallback_counter += 1
              name = f'{base.rsplit(".", 1)[0]}-{fallback_counter}.js'
              used_names.add(name)
              return name

          def externalise_script(match):
              attrs = match.group('attrs') or ''
              body = match.group('body')
              if re.search(r'\bsrc\s*=', attrs, re.I):
                  return match.group(0)
              if re.search(r'type\s*=\s*["\']application/ld\+json["\']', attrs, re.I):
                  return match.group(0)

              body = re.sub(
                  r'// Premium navigation scroll effect.*?// Initialize Scroll Animations with premium settings',
                  '// Navigation is consolidated in scripts/navigation.js\n\n        // Initialize Scroll Animations with premium settings',
                  body,
                  count=1,
                  flags=re.S,
              )
              body = re.sub(
                  r'// Side Panel Controls.*?// Close all modals',
                  '// Side panel navigation is consolidated in scripts/navigation.js\n\n        // Close all modals',
                  body,
                  count=1,
                  flags=re.S,
              )
              body = re.sub(
                  r'// NAVIGATION FUNCTIONALITY.*?// Core highlights slider',
                  '// Navigation is consolidated in scripts/navigation.js\n\n    // Core highlights slider',
                  body,
                  count=1,
                  flags=re.S,
              )

              if not body.strip():
                  return ''

              if 'tdsui-offer-sheet-open' in body:
                  name = unique_name('mobile-navigation.js')
              elif 'contactForm' in body and 'legalContent' in body:
                  name = unique_name('homepage.js')
              elif 'Core highlights slider' in body:
                  name = unique_name('homepage-slider.js')
              elif 'AOS.init' in body:
                  name = unique_name('homepage-init.js')
              else:
                  fallback_counter_local = len(script_files) + 1
                  name = unique_name(f'homepage-inline-{fallback_counter_local:02d}.js')

              (scripts_dir / name).write_text(body.strip() + '\n', encoding='utf-8')
              script_files.append(name)
              return f'<script src="/scripts/{name}"></script>'

          html = script_pattern.sub(externalise_script, html)

          # 7) Replace the temporary rebuild helper with a dedicated navigation file.
          html = html.replace(
              '<script src="scripts/rebuild-images.js"></script>',
              '<script src="/scripts/navigation.js"></script>',
          )
          html = html.replace(
              '<script src="/scripts/rebuild-images.js"></script>',
              '<script src="/scripts/navigation.js"></script>',
          )

          navigation_js = r'''(function () {
            'use strict';

            var LOCAL_HOSTS = ['localhost', '127.0.0.1', '::1'];
            var isLocalPreview = LOCAL_HOSTS.indexOf(window.location.hostname) !== -1;
            var localRouteMap = {
              '/': '/index.html',
              '/about-us': '/about-us.html',
              '/our-services': '/our-services.html',
              '/telemedia-suite': '/telemedia-suite.html',
              '/contact-us': '/contact-us.html',
              '/ehr': '/ehr.html',
              '/app': '/teledoctorsa-app.html',
              '/ecg247': '/ecg247.html',
              '/virtual-consultations': '/virtual-consultations.html',
              '/privacy-policy': '/privacy-policy.html',
              '/legal-notice': '/legal-notice.html',
              '/shop': '/shop.html'
            };

            function normaliseLocalRoute(href) {
              if (!isLocalPreview || !href || href.charAt(0) !== '/' || href.indexOf('//') === 0) return '';
              try {
                var url = new URL(href, window.location.origin);
                var path = url.pathname.replace(/\/$/, '') || '/';
                return localRouteMap[path] ? localRouteMap[path] + url.search + url.hash : '';
              } catch (error) {
                return '';
              }
            }

            function init() {
              var hamburger = document.getElementById('hamburgerBtn');
              var navLinks = document.getElementById('navLinks');
              var mobileOverlay = document.getElementById('mobileOverlay');
              var openPanelBtn = document.getElementById('openPanelBtn');
              var closePanelBtn = document.getElementById('closePanelBtn');
              var sidePanel = document.getElementById('sidePanel');
              var sidePanelOverlay = document.getElementById('sidePanelOverlay');
              var contactDropdown = document.querySelector('.contact-dropdown');
              var contactButton = contactDropdown ? contactDropdown.querySelector('button') : null;
              var contactMenu = contactDropdown ? contactDropdown.querySelector('.contact-menu') : null;
              var nav = document.querySelector('nav:not(.tds-mobile-nav)');

              function setMobileOpen(open) {
                if (!hamburger || !navLinks) return;
                hamburger.classList.toggle('active', open);
                navLinks.classList.toggle('active', open);
                hamburger.setAttribute('aria-expanded', open ? 'true' : 'false');
                if (mobileOverlay) mobileOverlay.classList.toggle('active', open);
                document.body.style.overflow = open ? 'hidden' : '';
              }

              if (hamburger && navLinks) {
                hamburger.setAttribute('aria-expanded', 'false');
                hamburger.addEventListener('click', function (event) {
                  event.preventDefault();
                  setMobileOpen(hamburger.getAttribute('aria-expanded') !== 'true');
                });
              }
              if (mobileOverlay) mobileOverlay.addEventListener('click', function () { setMobileOpen(false); });

              function setPanelOpen(open) {
                if (!openPanelBtn || !sidePanel || !sidePanelOverlay) return;
                sidePanel.classList.toggle('active', open);
                sidePanelOverlay.classList.toggle('active', open);
                openPanelBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                document.body.style.overflow = open ? 'hidden' : '';
              }

              if (openPanelBtn) {
                openPanelBtn.setAttribute('aria-expanded', 'false');
                openPanelBtn.addEventListener('click', function (event) {
                  event.preventDefault();
                  setPanelOpen(true);
                });
              }
              if (closePanelBtn) closePanelBtn.addEventListener('click', function (event) { event.preventDefault(); setPanelOpen(false); });
              if (sidePanelOverlay) sidePanelOverlay.addEventListener('click', function () { setPanelOpen(false); });

              function setContactOpen(open) {
                if (!contactButton || !contactMenu) return;
                contactButton.setAttribute('aria-expanded', open ? 'true' : 'false');
                contactMenu.style.opacity = open ? '1' : '0';
                contactMenu.style.visibility = open ? 'visible' : 'hidden';
                contactMenu.style.transform = open ? 'translateY(0)' : 'translateY(-8px)';
                contactMenu.style.pointerEvents = open ? 'auto' : 'none';
              }

              if (contactButton && contactMenu) {
                contactButton.type = 'button';
                contactButton.setAttribute('aria-expanded', 'false');
                contactButton.addEventListener('click', function (event) {
                  event.preventDefault();
                  event.stopPropagation();
                  setContactOpen(contactButton.getAttribute('aria-expanded') !== 'true');
                });
                document.addEventListener('click', function (event) {
                  if (!contactDropdown.contains(event.target)) setContactOpen(false);
                });
              }

              document.addEventListener('click', function (event) {
                var anchor = event.target.closest && event.target.closest('a[href]');
                if (!anchor) return;
                if (window.innerWidth <= 900 && navLinks && navLinks.contains(anchor)) setMobileOpen(false);
                var localTarget = normaliseLocalRoute(anchor.getAttribute('href'));
                if (!localTarget || anchor.target === '_blank' || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
                event.preventDefault();
                window.location.href = localTarget;
              });

              document.addEventListener('keydown', function (event) {
                if (event.key !== 'Escape') return;
                setPanelOpen(false);
                setContactOpen(false);
                setMobileOpen(false);
              });

              if (nav) {
                window.addEventListener('scroll', function () {
                  nav.classList.toggle('scrolled', window.scrollY > 10);
                }, { passive: true });
              }
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
            else init();
          })();
          '''
          (scripts_dir / 'navigation.js').write_text(navigation_js.strip() + '\n', encoding='utf-8')

          # 8) Add external CSS in a deterministic order: legacy, production polish, final homepage system.
          legacy_link = '<link rel="stylesheet" href="/styles/index-legacy.css?v=20260909">'
          final_link = '<link rel="stylesheet" href="/styles/homepage.css?v=20260909">'
          polish_pattern = re.compile(r'<link rel="stylesheet" href="/site-polish\.css\?v=20260909"[^>]*>')
          match = polish_pattern.search(html)
          if match:
              html = html[:match.start()] + legacy_link + '\n    ' + match.group(0) + '\n    ' + final_link + html[match.end():]
          else:
              html = html.replace('</head>', f'    {legacy_link}\n    <link rel="stylesheet" href="/site-polish.css?v=20260909">\n    {final_link}\n</head>', 1)

          homepage_css = r'''/* TeleDoctorSA homepage refactor | 2026-09-09 */
          :root {
            --tds-shell: 1240px;
            --tds-gutter-desktop: 24px;
            --tds-gutter-tablet: 28px;
            --tds-gutter-mobile: 18px;
            --tds-radius: 4px;
            --tds-shadow: 0 8px 24px rgba(15, 23, 42, .08);
            --tds-navy: #0f172a;
            --tds-orange: #f28a4b;
            --tds-white: #ffffff;
            --tds-soft: #f8fafc;
            --tds-border: #e2e8f0;
            --tds-muted: #64748b;
          }

          html, body { width: 100%; max-width: 100%; margin: 0; }
          body { overflow-x: clip; }
          *, *::before, *::after { box-sizing: border-box; }
          img, svg, video, iframe { max-width: 100%; }

          .section-inner,
          .services-header,
          .services-grid,
          .info-grid,
          .telemedicine-explainer-grid,
          .trust-assurance-grid,
          .location-grid,
          .objectives-content,
          .shop-discovery-inner,
          .core-slider-shell,
          .site-footer-shell {
            width: min(var(--tds-shell), calc(100% - (2 * var(--tds-gutter-desktop)))) !important;
            max-width: var(--tds-shell) !important;
            margin-inline: auto !important;
          }

          .hero,
          .hero-section,
          .page-hero {
            min-height: 0 !important;
            padding-top: 96px !important;
            padding-bottom: 72px !important;
          }

          .services,
          .services-section,
          .telemedicine-explainer,
          .trust-assurance,
          .shop-discovery,
          .objectives,
          .objectives-section {
            padding-top: 76px !important;
            padding-bottom: 76px !important;
          }

          .services-grid {
            grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
            gap: 16px !important;
          }
          .services-grid > .card {
            min-width: 0 !important;
            min-height: 0 !important;
            height: auto !important;
            border-radius: var(--tds-radius) !important;
            box-shadow: var(--tds-shadow) !important;
          }
          .services-grid > .card .card-img {
            height: 132px !important;
            min-height: 132px !important;
            max-height: 132px !important;
            border-radius: 0 !important;
            background: var(--tds-navy) !important;
          }
          .services-grid > .card .card-content { padding: 14px 15px 15px !important; }
          .services-grid > .card h3 { margin-bottom: 7px !important; font-size: 1.02rem !important; line-height: 1.24 !important; }
          .services-grid > .card p { margin-bottom: 10px !important; font-size: .88rem !important; line-height: 1.5 !important; }
          .services-grid > .card .card-kicker,
          .site-footer-kicker,
          .site-footer-chip,
          .core-proof-strip span,
          [class*="kicker"], [class*="chip"] { border-radius: var(--tds-radius) !important; }

          .info-focus-card,
          .trust-proof-card,
          .contact-card,
          .telemedicine-explainer-card,
          .trust-assurance-panel,
          .trust-faq-card {
            border-radius: var(--tds-radius) !important;
            box-shadow: var(--tds-shadow) !important;
          }

          .btn, .btn-main, .read-more, .learn-more-btn, .cta-btn, .link-btn,
          .site-footer-link, .core-slide-cta, .shop-role-actions a {
            border-radius: var(--tds-radius) !important;
          }

          .btn-main,
          .site-footer-link.primary,
          .telemedicine-explainer-card,
          [class*="primary"] {
            background-image: none !important;
          }
          .site-footer-link.primary { background: var(--tds-orange) !important; }
          .telemedicine-explainer-card { background: var(--tds-orange) !important; }

          .floating-shapes,
          .map-brand-badge,
          [class*="particle"],
          [class*="sparkle"],
          .site-footer::before,
          .site-footer::after,
          nav:not(.tds-mobile-nav)::before {
            display: none !important;
            animation: none !important;
          }
          .logo-text::before,
          .core-proof-strip span,
          .site-footer-chip,
          .site-footer-kicker { animation: none !important; }

          .location {
            padding: 72px 0 56px !important;
            min-height: 0 !important;
            background: var(--tds-navy) !important;
          }
          .location-grid {
            display: grid !important;
            grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr) !important;
            gap: 28px !important;
            align-items: stretch !important;
          }
          .location-content,
          .map-column { min-width: 0 !important; }
          .location-content h2 { margin-bottom: 10px !important; }
          .location-subtitle { margin-bottom: 20px !important; max-width: 620px !important; }
          .contact-cards {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 12px !important;
          }
          .contact-card { padding: 15px !important; }
          .map-column { display: flex !important; }
          .map-container {
            width: 100% !important;
            height: auto !important;
            min-height: 410px !important;
            border-radius: var(--tds-radius) !important;
            clip-path: none !important;
            box-shadow: 0 10px 30px rgba(0,0,0,.22) !important;
            transform: none !important;
            border-top: 2px solid var(--tds-orange) !important;
          }
          .map-container:hover { transform: none !important; box-shadow: 0 10px 30px rgba(0,0,0,.22) !important; }

          footer.site-footer,
          .site-footer {
            padding: 30px 0 0 !important;
            background: var(--tds-navy) !important;
            border-radius: 0 !important;
          }
          .site-footer-shell {
            width: min(var(--tds-shell), calc(100% - (2 * var(--tds-gutter-desktop)))) !important;
            padding: 0 !important;
          }
          .site-footer-grid {
            display: grid !important;
            grid-template-columns: 1.25fr 1fr 1fr 1fr !important;
            gap: 28px !important;
            align-items: start !important;
          }
          .site-footer-brand,
          .site-footer-column { min-width: 0 !important; }
          .site-footer-brandline img { width: 42px !important; height: 42px !important; border-radius: var(--tds-radius) !important; }
          .site-footer-brandline strong { font-size: 1.15rem !important; }
          .site-footer-brandline span,
          .site-footer-brand p,
          .site-footer-list a,
          .site-footer-list span { font-size: .9rem !important; line-height: 1.5 !important; }
          .site-footer-column h3 { font-size: .98rem !important; margin-bottom: 10px !important; }
          .site-footer-list { gap: 7px !important; }
          .site-footer-bottom {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 18px !important;
            margin-top: 24px !important;
            padding: 16px 0 18px !important;
            border-top: 1px solid rgba(255,255,255,.12) !important;
            font-size: .82rem !important;
          }
          .site-footer-copyright { color: rgba(255,255,255,.64) !important; }
          .site-footer-legal-links {
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: flex-end !important;
            gap: 8px 14px !important;
            position: static !important;
            width: auto !important;
            padding: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
            border: 0 !important;
          }
          .site-footer-legal-links a {
            color: rgba(255,255,255,.72) !important;
            text-decoration: none !important;
            font-size: .82rem !important;
          }
          .site-footer-legal-links a:hover { color: #fff !important; }

          [style*="border-radius: 999px"],
          [style*="border-radius:999px"] { border-radius: var(--tds-radius) !important; }

          @media (max-width: 1080px) {
            .section-inner,
            .services-header,
            .services-grid,
            .info-grid,
            .telemedicine-explainer-grid,
            .trust-assurance-grid,
            .location-grid,
            .objectives-content,
            .shop-discovery-inner,
            .core-slider-shell,
            .site-footer-shell {
              width: min(var(--tds-shell), calc(100% - (2 * var(--tds-gutter-tablet)))) !important;
            }
            .services-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
            .location-grid { grid-template-columns: 1fr !important; }
            .contact-cards { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
            .map-container { min-height: 330px !important; }
            .site-footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
          }

          @media (max-width: 720px) {
            .section-inner,
            .services-header,
            .services-grid,
            .info-grid,
            .telemedicine-explainer-grid,
            .trust-assurance-grid,
            .location-grid,
            .objectives-content,
            .shop-discovery-inner,
            .core-slider-shell,
            .site-footer-shell {
              width: calc(100% - (2 * var(--tds-gutter-mobile))) !important;
            }
            .hero,
            .hero-section,
            .page-hero { padding-top: 82px !important; padding-bottom: 48px !important; }
            .services,
            .services-section,
            .telemedicine-explainer,
            .trust-assurance,
            .shop-discovery,
            .objectives,
            .objectives-section { padding-top: 52px !important; padding-bottom: 52px !important; }
            .services-grid,
            .contact-cards,
            .site-footer-grid { grid-template-columns: 1fr !important; }
            .services-grid > .card { display: block !important; }
            .services-grid > .card .card-img { width: 100% !important; height: 118px !important; min-height: 118px !important; max-height: 118px !important; }
            .location { padding: 52px 0 40px !important; }
            .map-container { min-height: 280px !important; }
            .site-footer-bottom { align-items: flex-start !important; flex-direction: column !important; }
            .site-footer-legal-links { justify-content: flex-start !important; }
          }

          @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
          }
          '''
          (styles_dir / 'homepage.css').write_text(homepage_css.strip() + '\n', encoding='utf-8')

          # 9) Increase the shared production shell site-wide without changing SEO metadata.
          polish = root / 'site-polish.css'
          if polish.exists():
              polish_text = polish.read_text(encoding='utf-8')
              polish_text = polish_text.replace('--tds-content-width: 1120px;', '--tds-content-width: 1240px;', 1)
              polish.write_text(polish_text, encoding='utf-8')

          # 10) Remove the obsolete helper if nothing references it anymore.
          rebuild = scripts_dir / 'rebuild-images.js'
          if rebuild.exists():
              references = [p for p in root.glob('*.html') if 'scripts/rebuild-images.js' in p.read_text(encoding='utf-8-sig') or '/scripts/rebuild-images.js' in p.read_text(encoding='utf-8-sig')]
              if not references:
                  rebuild.unlink()

          index.write_text(html, encoding='utf-8')

          # Structural validation.
          checks = {
              'single footer': html.count('<footer') == 1 and html.count('</footer>') == 1,
              'legal strip removed': 'legal-links-section' not in html,
              'detached map badge removed': 'map-brand-badge' not in html,
              'footer legal bar added': 'site-footer-legal-links' in html,
              'final homepage stylesheet added': '/styles/homepage.css?v=20260909' in html,
              'legacy CSS externalised': '<style' not in html.lower(),
              'navigation externalised': '/scripts/navigation.js' in html,
              'duplicate script close removed': '<!-- TDS_MOBILE_NAV_SCRIPT_END -->\n</script>' not in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))

          print('removed map badge:', removed_badge)
          print('removed legal strip:', removed_legal_strip)
          print('replaced footer bottom:', footer_bottom_count)
          print('extracted style blocks:', len(style_blocks))
          print('externalised inline scripts:', len(script_files))
          print('script files:', ', '.join(script_files))

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          set -e
          for f in scripts/navigation.js scripts/homepage*.js scripts/mobile-navigation*.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
          git diff --check
          test "$(grep -c '<footer' index.html)" -eq 1
          test "$(grep -c '</footer>' index.html)" -eq 1
          ! grep -q 'legal-links-section' index.html
          ! grep -q 'map-brand-badge' index.html
          grep -q 'site-footer-legal-links' index.html
          grep -q '/styles/homepage.css?v=20260909' index.html
          grep -q '/scripts/navigation.js' index.html

      - name: Commit refactor and remove one-time workflow
        shell: bash
        run: |
          set -e
          rm .github/workflows/refactor-homepage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate TeleDoctorSA homepage layout and footer"
          git push
