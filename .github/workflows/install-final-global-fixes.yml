name: Install final global fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/final-global-fixes.js'
      - '.github/workflows/install-final-global-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject final global fixes into HTML pages
        shell: python
        run: |
          from pathlib import Path

          marker = '<script src="scripts/final-global-fixes.js"></script>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8-sig')
              if marker in text:
                  continue
              if '</body>' not in text:
                  continue
              text = text.replace('</body>', '    ' + marker + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print(f'Injected into {len(changed)} HTML pages')
          for item in changed:
              print(item)

      - name: Commit generated HTML changes
        run: |
          if git diff --quiet; then
            echo "No HTML changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "chore: install final global footer and logo fixes"
          git push
