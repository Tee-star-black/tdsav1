name: Import TDSA rebuild images

on:
  push:
    paths:
      - '.github/workflows/import-rebuild-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current TDSA site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout scrapped TDSA rebuild
        uses: actions/checkout@v4
        with:
          repository: Tee-star-black/teledoctorsa-rebuild
          path: _rebuild

      - name: Import image library
        shell: bash
        run: |
          set -e
          mkdir -p images/rebuild
          cp -R _rebuild/public/images/home/. images/rebuild/
          rm -rf _rebuild
          echo "Imported image files:"
          find images/rebuild -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Commit imported images
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/rebuild
          if git diff --cached --quiet; then
            echo "Image library already up to date."
            exit 0
          fi
          git commit -m "assets: import TDSA rebuild image library"
          git push
