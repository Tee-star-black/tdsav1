name: Refactor TeleDoctorSA homepage v4

on:
  push:
    paths:
      - '.github/workflows/refactor-homepage-v4.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validated refactor
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/refactor-homepage-v3.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Refactor homepage\n'
          end_marker = '\n      - name: Validate JS and structure\n'
          start = workflow.index(start_marker)
          run_pos = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index(end_marker, run_pos)
          script = textwrap.dedent(workflow[run_pos:end])
          exec(compile(script, 'refactor-homepage-v3.py', 'exec'), {'__name__': '__main__'})

          # Normalize whitespace after extraction so git diff validation is strict and clean.
          targets = [Path('index.html'), Path('site-polish.css')]
          targets += list(Path('styles').glob('*.css'))
          targets += list(Path('scripts').glob('homepage*.js'))
          targets += list(Path('scripts').glob('mobile-navigation*.js'))
          targets += [Path('scripts/navigation.js')]
          for path in targets:
              if not path.exists() or not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              cleaned = '\n'.join(line.rstrip() for line in text.splitlines()) + '\n'
              path.write_text(cleaned, encoding='utf-8')

      - name: Validate JavaScript, HTML structure and diff
        shell: bash
        run: |
          set -e
          for f in scripts/navigation.js scripts/homepage*.js scripts/mobile-navigation*.js; do
            [ ! -f "$f" ] || node --check "$f"
          done
          git diff --check
          test "$(grep -c '<footer' index.html)" -eq 1
          test "$(grep -c '</footer>' index.html)" -eq 1
          ! grep -q 'legal-links-section' index.html
          ! grep -q 'map-brand-badge' index.html
          ! grep -qi '<style' index.html
          grep -q 'site-footer-legal-links' index.html
          grep -q '/styles/index-legacy.css?v=20260909' index.html
          grep -q '/styles/homepage.css?v=20260909' index.html
          grep -q '/scripts/navigation.js' index.html
          grep -q 'Privacy' index.html
          grep -q 'Service Fulfilment' index.html
          grep -q 'Governing Law' index.html

      - name: Commit refactor
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/refactor-homepage.yml \
                .github/workflows/refactor-homepage-v2.yml \
                .github/workflows/refactor-homepage-v3.yml \
                .github/workflows/refactor-homepage-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate TeleDoctorSA homepage layout and footer"
          git push
