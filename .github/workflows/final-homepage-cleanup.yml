name: Final TeleDoctorSA homepage cleanup

on:
  push:
    paths:
      - '.github/workflows/final-homepage-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten homepage markup and legacy animation definitions
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          html, shop_removed = re.subn(r'\s*<section class="shop-discovery">.*?</section>', '', html, count=1, flags=re.S)
          html, objective_removed = re.subn(r'\s*<section class="objectives">.*?</section>', '', html, count=1, flags=re.S)
          html = html.replace(' class="logo" style="text-decoration: none; cursor: pointer;"', ' class="logo"', 1)
          html = re.sub(r'(<div class="card"[^>]*?)\sdata-aos="[^"]*"(?:\sdata-aos-delay="[^"]*")?', r'\1', html)
          html = re.sub(r'(<div class="contact-card"[^>]*?)\sdata-aos="[^"]*"(?:\sdata-aos-delay="[^"]*")?', r'\1', html)
          index.write_text('\n'.join(line.rstrip() for line in html.splitlines()) + '\n', encoding='utf-8')

          legacy_path = Path('styles/index-legacy.css')
          legacy = legacy_path.read_text(encoding='utf-8')
          keyframe_re = re.compile(r'@(?:-webkit-)?keyframes\s+([A-Za-z0-9_-]+)\s*\{')
          seen = set()
          removals = []
          pos = 0
          while True:
              match = keyframe_re.search(legacy, pos)
              if not match:
                  break
              depth = 0
              start_brace = legacy.find('{', match.start())
              cursor = start_brace
              while cursor < len(legacy):
                  if legacy[cursor] == '{':
                      depth += 1
                  elif legacy[cursor] == '}':
                      depth -= 1
                      if depth == 0:
                          cursor += 1
                          break
                  cursor += 1
              name = match.group(1)
              if name in seen:
                  removals.append((match.start(), cursor))
              else:
                  seen.add(name)
              pos = max(cursor, match.end())
          for start, end in reversed(removals):
              legacy = legacy[:start] + legacy[end:]
          legacy_path.write_text('\n'.join(line.rstrip() for line in legacy.splitlines()) + '\n', encoding='utf-8')

          print('shop section removed:', shop_removed)
          print('redundant CTA section removed:', objective_removed)
          print('duplicate keyframes removed:', len(removals))

      - name: Validate final homepage
        shell: bash
        run: |
          set -e
          node --check scripts/navigation.js
          node --check scripts/homepage.js
          node --check scripts/homepage-slider.js
          node --check scripts/mobile-navigation.js
          git diff --check
          test "$(grep -c '<footer' index.html)" -eq 1
          test "$(grep -c '</footer>' index.html)" -eq 1
          ! grep -q 'legal-links-section' index.html
          ! grep -q 'map-brand-badge' index.html
          ! grep -q '<section class="shop-discovery"' index.html
          ! grep -q '<section class="objectives"' index.html
          grep -q 'site-footer-legal-links' index.html
          grep -q '/styles/homepage.css?v=20260909' index.html
          grep -q '/scripts/navigation.js' index.html

      - name: Commit final cleanup
        shell: bash
        run: |
          set -e
          rm .github/workflows/final-homepage-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: tighten homepage rhythm and animation system"
          git push
