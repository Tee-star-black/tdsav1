name: Fix home mobile care and booking
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-mobile-care-and-booking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage mobile carousels and booking route
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          js_path = Path('scripts/home-core-slide-images.js')
          text = js_path.read_text(encoding='utf-8')

          hidden_rule = '''      .core-slide[hidden] {
        display: none !important;
      }

'''
          marker = '      .core-slide-copy {\n'
          if hidden_rule not in text and marker in text:
              text = text.replace(marker, hidden_rule + marker, 1)

          mobile_care_css = '''      @media (max-width: 820px) {
        .services {
          overflow: hidden !important;
          padding-left: 0 !important;
          padding-right: 0 !important;
        }

        .services .services-header {
          width: 100% !important;
          padding-left: 16px !important;
          padding-right: 16px !important;
          box-sizing: border-box !important;
        }

        .services-grid {
          width: 100% !important;
          max-width: none !important;
          display: flex !important;
          grid-template-columns: none !important;
          gap: 14px !important;
          margin: 0 !important;
          padding: 0 16px 14px !important;
          overflow-x: auto !important;
          overflow-y: hidden !important;
          scroll-snap-type: x mandatory !important;
          scroll-padding-inline: 16px !important;
          overscroll-behavior-inline: contain !important;
          -webkit-overflow-scrolling: touch !important;
          scrollbar-width: none !important;
          touch-action: pan-x pan-y !important;
          box-sizing: border-box !important;
        }

        .services-grid::-webkit-scrollbar {
          display: none !important;
        }

        .services-grid > .card {
          flex: 0 0 min(360px, calc(100vw - 48px)) !important;
          width: min(360px, calc(100vw - 48px)) !important;
          max-width: min(360px, calc(100vw - 48px)) !important;
          scroll-snap-align: start !important;
          scroll-snap-stop: always !important;
        }
      }

'''
          marker_mobile = '      @media (max-width: 560px) {\n'
          if mobile_care_css not in text and marker_mobile in text:
              text = text.replace(marker_mobile, mobile_care_css + marker_mobile, 1)

          helpers = '''  function normalizeConsultationLinks() {
    var bookingUrl = 'https://patient.drmukudu.co.za/?fresh=1';
    document.querySelectorAll('a[href]').forEach(function (link) {
      var label = (link.textContent || '').replace(/\\s+/g, ' ').trim().toLowerCase();
      var href = (link.getAttribute('href') || '').toLowerCase();
      var isBookingCta = /book( online| a)? consultation/.test(label);
      var isWrongUpvioConsultation = href.indexOf('upvio') !== -1 && label.indexOf('consult') !== -1;

      if (isBookingCta || isWrongUpvioConsultation) {
        link.setAttribute('href', bookingUrl);
        link.removeAttribute('target');
        link.removeAttribute('rel');
      }
    });
  }

  function enableCoreSwipe() {
    var slider = document.querySelector('.core-highlights-slider');
    if (!slider || slider.dataset.tdsSwipeReady === 'true') return;
    slider.dataset.tdsSwipeReady = 'true';

    var startX = 0;
    var startY = 0;

    slider.addEventListener('touchstart', function (event) {
      if (!event.touches || !event.touches.length) return;
      startX = event.touches[0].clientX;
      startY = event.touches[0].clientY;
    }, { passive: true });

    slider.addEventListener('touchend', function (event) {
      if (!event.changedTouches || !event.changedTouches.length) return;
      var dx = event.changedTouches[0].clientX - startX;
      var dy = event.changedTouches[0].clientY - startY;

      if (Math.abs(dx) < 48 || Math.abs(dx) <= Math.abs(dy)) return;

      var control = document.querySelector(dx < 0 ? '[data-core-slider-next]' : '[data-core-slider-prev]');
      if (control) control.click();
    }, { passive: true });
  }

'''
          marker_init = '  function init() {\n'
          if helpers not in text and marker_init in text:
              text = text.replace(marker_init, helpers + marker_init, 1)

          old_init = '''  function init() {
    addStyles();
    applyImages();
'''
          new_init = '''  function init() {
    addStyles();
    applyImages();
    normalizeConsultationLinks();
    enableCoreSwipe();
'''
          if old_init in text:
              text = text.replace(old_init, new_init, 1)

          old_timer = '''    var timer = window.setInterval(function () {
      attempts += 1;
      if (applyImages() || attempts >= 12) window.clearInterval(timer);
    }, 250);
'''
          new_timer = '''    var timer = window.setInterval(function () {
      attempts += 1;
      applyImages();
      normalizeConsultationLinks();
      if (attempts >= 12) window.clearInterval(timer);
    }, 250);
'''
          if old_timer in text:
              text = text.replace(old_timer, new_timer, 1)

          js_path.write_text(text, encoding='utf-8')

          booking_url = 'https://patient.drmukudu.co.za/?fresh=1'
          vc_path = Path('virtual-consultations.html')
          vc = vc_path.read_text(encoding='utf-8')
          vc = vc.replace('https://teledoctorsa.co.za/upvio', booking_url)
          vc = vc.replace('content="0; url=upvio.html"', f'content="0; url={booking_url}"')
          vc = vc.replace("window.location.replace('upvio.html');", f"window.location.replace('{booking_url}');")
          vc = vc.replace('href="upvio.html"', f'href="{booking_url}"')
          vc_path.write_text(vc, encoding='utf-8')

          workflow = Path('.github/workflows/fix-home-mobile-care-and-booking.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "TDSA Mobile Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: mobile care carousels and consultation booking route"
          git push origin main
