name: Install spacious layout
on:
  push:
    paths:
      - 'scripts/spacious-layout.js'
      - '.github/workflows/install-spacious-layout.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject spacious layout script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          target = Path('index.html')
          text = target.read_text(encoding='utf-8-sig')
          tag = '    <script src="scripts/spacious-layout.js"></script>\n'
          if tag.strip() not in text:
              text = text.replace('</body>', tag + '</body>', 1)
              target.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: apply spacious homepage layout"
            git push
          fi