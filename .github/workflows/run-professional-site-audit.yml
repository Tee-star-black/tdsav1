name: Run professional site audit

on:
  push:
    branches:
      - fix/professional-site-audit-20260909

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/professional-site-audit-20260909

      - name: Apply professional site audit
        run: python3 scripts/apply-professional-site-audit.py

      - name: Validate whitespace and structure
        run: |
          git diff --check
          python3 -m py_compile scripts/apply-professional-site-audit.py

      - name: Commit audited site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: professionalize responsive HTML site"
            git push origin HEAD:fix/professional-site-audit-20260909
          fi
