name: Run professional site audit

on:
  push:
    branches:
      - fix/professional-site-audit-20260909

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/professional-site-audit-20260909

      - name: Apply professional site audit
        run: |
          python3 scripts/apply-professional-site-audit.py
          python3 scripts/fix-production-references.py

      - name: Validate whitespace and Python syntax
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          for path in [Path('scripts/apply-professional-site-audit.py'), Path('scripts/fix-production-references.py')]:
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('Python syntax validation passed.')
          PY

      - name: Commit audited site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: complete production HTML site audit"
            git push origin HEAD:fix/professional-site-audit-20260909
          fi
